          contents:
            - href: notebooks/sensitivity_battery.qmd
              text: "Sensitivity checks"
            - href: notebooks/assemble_artifacts.qmd
              text: "Publication artifacts"

# Select the profile-specific sidebar for every Nature Health page. The base
# website sidebar remains available to the existing public-site workflow.
sidebar: nathealth

execute:
  freeze: false
  warning: true
  message: true
  error: false

format:
  html:
    toc: true
    toc-depth: 3
    code-tools: true
    code-fold: true
    code-summary: "Show R code"
    page-layout: full
