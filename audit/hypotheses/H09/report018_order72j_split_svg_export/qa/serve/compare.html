<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H09 Order72j comparison</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; color: #171717; background: #e9e9e6; }
    header { margin-bottom: 16px; }
    h1 { margin: 0 0 6px; font-size: 23px; }
    p { margin: 4px 0; font-size: 14px; line-height: 1.4; }
    a { color: #124f8c; }
    #status { display: inline-block; margin-top: 8px; padding: 4px 8px; border-radius: 4px; background: #fff4c2; font-weight: 650; }
    #status.pass { color: #0a5c2f; background: #dff4e7; }
    #comparison { display: grid; grid-template-columns: repeat(2, max-content); align-items: start; gap: 18px; }
    #comparison.intrinsic { grid-template-columns: max-content; }
    figure { margin: 0; padding: 10px; background: #fff; border: 1px solid #a7a7a3; box-shadow: 0 1px 3px rgb(0 0 0 / 10%); }
    figcaption { margin-bottom: 8px; font-size: 14px; font-weight: 700; }
    img { display: block; height: auto; background: #fff; }
    .metadata { color: #444; }
  </style>
</head>
<body>
  <header>
    <h1 id="heading">H09 Order72j comparison</h1>
    <p id="dimensions" class="metadata"></p>
    <p><a href="index.html">Route inventory</a> · <a id="pdf-link" href="#">Pinned accepted PDF</a></p>
    <p id="status" role="status">Loading both local assets</p>
  </header>
  <main id="comparison" aria-label="Candidate SVG and accepted PNG comparison">
    <figure>
      <figcaption>Immutable candidate SVG</figcaption>
      <img id="candidate" alt="H09 candidate SVG for visual inspection">
    </figure>
    <figure>
      <figcaption>Pinned accepted PNG comparator</figcaption>
      <img id="comparator" alt="H09 accepted PNG comparator for visual inspection">
    </figure>
  </main>
  <script>
    (() => {
      "use strict";
      const definitions = {
        primary: {
          label: "Primary effects",
          stem: "H09_primary_effects",
          widthPt: 1134,
          heightPt: 702,
          pngWidth: 4725,
          pngHeight: 2925
        },
        observed: {
          label: "Observed timing patterns",
          stem: "H09_observed_timing_patterns",
          widthPt: 1134,
          heightPt: 918,
          pngWidth: 4725,
          pngHeight: 3825
        }
      };
      const params = new URLSearchParams(window.location.search);
      const component = params.get("component");
      const widthMode = params.get("width");
      const definition = definitions[component];
      const allowedWidths = new Set(["intrinsic", "642", "708"]);
      if (!definition || !allowedWidths.has(widthMode)) {
        throw new Error("Unsupported comparison route");
      }
      const intrinsicCssWidth = definition.widthPt * 96 / 72;
      const targetCssWidth = widthMode === "intrinsic"
        ? intrinsicCssWidth
        : Number(widthMode);
      const targetCssHeight = targetCssWidth * definition.heightPt / definition.widthPt;
      const candidate = document.getElementById("candidate");
      const comparator = document.getElementById("comparator");
      const comparison = document.getElementById("comparison");
      if (widthMode === "intrinsic") comparison.classList.add("intrinsic");
      for (const image of [candidate, comparator]) {
        image.style.width = `${targetCssWidth}px`;
      }
      candidate.src = `assets/${definition.stem}.svg`;
      comparator.src = `assets/${definition.stem}.png`;
      document.getElementById("pdf-link").href = `assets/${definition.stem}.pdf`;
      document.getElementById("heading").textContent = `${definition.label}: ${widthMode === "intrinsic" ? "intrinsic vector size" : `${widthMode} CSS px`}`;
      document.getElementById("dimensions").textContent = `Target ${targetCssWidth.toFixed(0)} × ${targetCssHeight.toFixed(0)} CSS px; native vector ${definition.widthPt} × ${definition.heightPt} pt; accepted PNG ${definition.pngWidth} × ${definition.pngHeight} px.`;

      const loaded = image => new Promise((resolve, reject) => {
        if (image.complete && image.naturalWidth > 0) return resolve();
        image.addEventListener("load", resolve, { once: true });
        image.addEventListener("error", reject, { once: true });
      });
      Promise.all([loaded(candidate), loaded(comparator)]).then(() => {
        const candidateRatio = candidate.naturalWidth / candidate.naturalHeight;
        const comparatorRatio = comparator.naturalWidth / comparator.naturalHeight;
        const aspectDifference = Math.abs(candidateRatio - comparatorRatio);
        const resources = performance.getEntriesByType("resource").map(entry => entry.name);
        const externalResources = resources.filter(url => new URL(url).origin !== window.location.origin);
        const pass = aspectDifference < 0.000001 && externalResources.length === 0;
        window.order72jQA = Object.freeze({
          route: window.location.href,
          component,
          widthMode,
          targetCssWidth,
          targetCssHeight,
          candidateNaturalWidth: candidate.naturalWidth,
          candidateNaturalHeight: candidate.naturalHeight,
          comparatorNaturalWidth: comparator.naturalWidth,
          comparatorNaturalHeight: comparator.naturalHeight,
          candidateRenderedWidth: candidate.getBoundingClientRect().width,
          candidateRenderedHeight: candidate.getBoundingClientRect().height,
          comparatorRenderedWidth: comparator.getBoundingClientRect().width,
          comparatorRenderedHeight: comparator.getBoundingClientRect().height,
          aspectDifference,
          externalResources,
          viewport: { width: window.innerWidth, height: window.innerHeight },
          status: pass ? "PASS" : "FAIL"
        });
        const status = document.getElementById("status");
        status.textContent = `${window.order72jQA.status}: both assets loaded; aspect-ratio difference ${aspectDifference.toExponential(2)}; external resources ${externalResources.length}.`;
        status.classList.toggle("pass", pass);
        document.documentElement.dataset.qaStatus = window.order72jQA.status;
        console.info("ORDER72J_VISUAL_ROUTE_READY", JSON.stringify(window.order72jQA));
      }).catch(error => {
        document.documentElement.dataset.qaStatus = "FAIL";
        document.getElementById("status").textContent = `FAIL: ${error.message}`;
        console.error("ORDER72J_VISUAL_ROUTE_FAILED", error);
      });
    })();
  </script>
</body>
</html>
