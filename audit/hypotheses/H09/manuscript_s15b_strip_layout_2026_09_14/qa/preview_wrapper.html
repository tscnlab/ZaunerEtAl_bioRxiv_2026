<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H09 S15B order 010a candidate preview</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; color: #171717; background: #ececea; }
    header { width: max-content; max-width: calc(100vw - 32px); margin-bottom: 12px; }
    h1 { margin: 0 0 5px; font-size: 20px; }
    p { margin: 3px 0; font-size: 13px; line-height: 1.35; }
    #status { display: inline-block; margin-top: 5px; padding: 3px 7px; background: #fff4c2; border-radius: 4px; font-weight: 650; }
    #status.pass { color: #0a5c2f; background: #dff4e7; }
    figure { width: max-content; margin: 0; padding: 0; background: #fff; border: 1px solid #7d7d79; overflow: visible; }
    img { display: block; height: auto; max-width: none; background: #fff; }
  </style>
</head>
<body>
  <header>
    <h1 id="heading">H09 S15B candidate</h1>
    <p id="dimensions"></p>
    <p id="status" role="status">Loading the local candidate SVG</p>
  </header>
  <main>
    <figure aria-label="H09 observed timing patterns candidate">
      <img id="candidate" src="H09_observed_timing_patterns.svg" alt="Observed chronotype and personal light-exposure timing patterns">
    </figure>
  </main>
  <script>
    (() => {
      "use strict";
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "original";
      const allowed = new Set(["original", "600", "narrow"]);
      if (!allowed.has(mode)) throw new Error("Unsupported preview mode");
      const image = document.getElementById("candidate");
      const widths = { original: 1512, "600": 600, narrow: 600 };
      image.style.width = `${widths[mode]}px`;
      if (mode === "narrow") image.style.maxWidth = "calc(100vw - 32px)";
      document.getElementById("heading").textContent = `H09 S15B candidate: ${mode}`;
      const ready = () => {
        const box = image.getBoundingClientRect();
        const resources = performance.getEntriesByType("resource").map(entry => entry.name);
        const externalResources = resources.filter(url => new URL(url).origin !== window.location.origin);
        const pass = image.naturalWidth > 0 && image.naturalHeight > 0 && externalResources.length === 0;
        window.order010aQA = Object.freeze({
          route: window.location.href,
          mode,
          viewportWidth: window.innerWidth,
          viewportHeight: window.innerHeight,
          naturalWidth: image.naturalWidth,
          naturalHeight: image.naturalHeight,
          renderedWidth: box.width,
          renderedHeight: box.height,
          pageScrollWidth: document.documentElement.scrollWidth,
          pageScrollHeight: document.documentElement.scrollHeight,
          externalResources,
          status: pass ? "PASS" : "FAIL"
        });
        document.getElementById("dimensions").textContent = `Rendered ${box.width.toFixed(2)} × ${box.height.toFixed(2)} CSS px in a ${window.innerWidth} × ${window.innerHeight} viewport.`;
        const status = document.getElementById("status");
        status.textContent = `${window.order010aQA.status}: native candidate loaded; external resources ${externalResources.length}.`;
        status.classList.toggle("pass", pass);
        document.documentElement.dataset.qaStatus = window.order010aQA.status;
        console.info("H09_S15B_ORDER010A_ROUTE_READY", JSON.stringify(window.order010aQA));
      };
      if (image.complete && image.naturalWidth > 0) ready();
      else image.addEventListener("load", ready, { once: true });
      image.addEventListener("error", () => {
        document.documentElement.dataset.qaStatus = "FAIL";
        document.getElementById("status").textContent = "FAIL: candidate SVG did not load.";
        console.error("H09_S15B_ORDER010A_ROUTE_FAILED");
      }, { once: true });
    })();
  </script>
</body>
</html>
