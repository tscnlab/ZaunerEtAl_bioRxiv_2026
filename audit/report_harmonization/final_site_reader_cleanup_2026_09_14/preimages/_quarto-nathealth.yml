# HTML-first Nature Health working profile.
#
# This profile is opt-in and does not alter the existing website build.
# Executable preparation, analysis, audit, manuscript, and supplementary
# documents are reviewed in HTML. The single submission-stage manuscript DOCX
# is deliberately deferred until the manuscript is stable.
project:
  type: website
  output-dir: _build/nathealth
  execute-dir: project
  post-render: scripts/report_harmonization/post_render_gt_html_semantics.R
  render:
    - notebooks/preparation/01_import_state_alignment.qmd
    - notebooks/preparation/02_coverage_sample_flow.qmd
    - notebooks/preparation/03_reference_profiles.qmd
    - notebooks/preparation/04_metric_derivation.qmd
    - notebooks/preparation/05_model_input_acquisition.qmd
    - notebooks/preparation/06_model_ready_datasets.qmd
    - notebooks/preparation/07_example_days.qmd
    - notebooks/placement_decision.qmd
    - notebooks/descriptives.qmd
    - notebooks/preregistration_deviations.qmd
    - notebooks/hypotheses/H01.qmd
    - audit/hypotheses/H01/H01_analysis_preparation.qmd
    - notebooks/hypotheses/H02.qmd
    - audit/hypotheses/H02/H02_analysis_preparation.qmd
    - notebooks/hypotheses/H03.qmd
    - audit/hypotheses/H03/H03_analysis_preparation.qmd
    - notebooks/hypotheses/H04.qmd
    - audit/hypotheses/H04/H04_analysis_preparation.qmd
    - notebooks/hypotheses/H05.qmd
    - audit/hypotheses/H05/H05_analysis_preparation.qmd
    - notebooks/hypotheses/H06.qmd
    - audit/hypotheses/H06/H06_analysis_preparation.qmd
    - notebooks/hypotheses/H06_daily.qmd
    - audit/hypotheses/H06_daily/H06_daily_analysis_preparation.qmd
    - notebooks/hypotheses/H07.qmd
    - audit/hypotheses/H07/H07_analysis_preparation.qmd
    - notebooks/hypotheses/H08.qmd
    - audit/hypotheses/H08/H08_analysis_preparation.qmd
    - notebooks/hypotheses/H09.qmd
    - audit/hypotheses/H09/H09_analysis_preparation.qmd
    - notebooks/hypotheses/H10.qmd
    - audit/hypotheses/H10/H10_analysis_preparation.qmd
    - notebooks/hypotheses/H11.qmd
    - audit/hypotheses/H11/H11_analysis_preparation.qmd
    - notebooks/sensitivity_battery.qmd
    - index.qmd
    - supplementary_information.qmd
    # Profile arrays are union-merged with the base configuration. Explicitly
    # exclude the superseded root analyses so an opt-in Nature Health render
    # cannot execute both architectures.
    - "!data_preparation.qmd"
    - "!metric_preparation.qmd"
    - "!Descriptives.qmd"
    - "!RQ1.qmd"
    - "!RQ2.qmd"
    - "!RQ3.qmd"
    - "!RQ1_chest.qmd"
    - "!RQ2_chest.qmd"
    - "!RQ3_chest.qmd"

# Use profile-specific navigation rather than exposing the long submitted-
# version sidebar inherited from the public website. The entry-point sidebar
# keeps the accepted reader-corpus order explicit for the corpus manifest; the
# reader-facing sidebar groups are surfaced as compact navbar menus.
website:
  title: "Nature Health analysis and manuscript"
  reader-mode: true
  navbar:
    title: "Personal light exposome"
    pinned: true
    collapse-below: xl
    search: true
    left:
      - text: "Manuscript"
        href: index.qmd
      - sidebar:study
      - sidebar:environment
      - sidebar:behaviour
      - sidebar:individual
      - text: "Supporting material"
        menu:
          - text: "Supplementary information"
            href: supplementary_information.qmd
          - text: "Sensitivity checks"
            href: notebooks/sensitivity_battery.qmd
    tools:
      - icon: github
        aria-label: "Project resources"
        menu:
          - text: "Source repository"
            href: https://github.com/tscnlab/ZaunerEtAl_bioRxiv_2026
          - text: "Report an issue"
            href: https://github.com/tscnlab/ZaunerEtAl_bioRxiv_2026/issues
          - text: "Study data repositories"
            href: https://github.com/MeLiDosProject
          - text: "License"
            href: LICENSE.md
  sidebar:
    - id: entry-points
      title: "Read"
      style: "floating"
      search: false
      contents:
        - href: index.qmd
          text: "Manuscript"
        - href: supplementary_information.qmd
          text: "Supplementary information"
    - id: study
      title: "Study & data"
      style: "floating"
      search: false
      collapse-level: 1
      contents:
        - section: "Prepare the analysis data"
          contents:
            - href: notebooks/preparation/01_import_state_alignment.qmd
              text: "01 · Import and align recordings"
            - href: notebooks/preparation/02_coverage_sample_flow.qmd
              text: "02 · Coverage and sample flow"
            - href: notebooks/preparation/03_reference_profiles.qmd
              text: "03 · Reference profiles"
            - href: notebooks/preparation/04_metric_derivation.qmd
              text: "04 · Light-exposure metrics"
            - href: notebooks/preparation/05_model_input_acquisition.qmd
              text: "05 · Questionnaire and diary inputs"
            - href: notebooks/preparation/06_model_ready_datasets.qmd
              text: "06 · Model-ready datasets"
            - href: notebooks/preparation/07_example_days.qmd
              text: "07 · Example days"
        - section: "Understand the study"
          contents:
            - href: notebooks/placement_decision.qmd
              text: "Sensor-placement decision"
            - href: notebooks/descriptives.qmd
              text: "Descriptive tables and figures"
            - href: notebooks/preregistration_deviations.qmd
              text: "Preregistration changes"
    - id: environment
      title: "Environment"
      style: "floating"
      search: false
      collapse-level: 1
      contents:
        - section: "Site and daily patterns"
          contents:
            - href: notebooks/hypotheses/H01.qmd
              text: "H01 · Findings: site differences"
            - href: audit/hypotheses/H01/H01_analysis_preparation.qmd
              text: "H01 · Methods and provenance"
            - href: notebooks/hypotheses/H02.qmd
              text: "H02 · Findings: daily site patterns"
            - href: audit/hypotheses/H02/H02_analysis_preparation.qmd
              text: "H02 · Methods and provenance"
    - id: behaviour
      title: "Behaviour & time"
      style: "floating"
      search: false
      collapse-level: 1
      contents:
        - section: "Reported context"
          contents:
            - href: notebooks/hypotheses/H03.qmd
              text: "H03 · Findings: light source"
            - href: audit/hypotheses/H03/H03_analysis_preparation.qmd
              text: "H03 · Methods and provenance"
            - href: notebooks/hypotheses/H04.qmd
              text: "H04 · Findings: activity"
            - href: audit/hypotheses/H04/H04_analysis_preparation.qmd
              text: "H04 · Methods and provenance"
        - section: "Habitual and daily context"
