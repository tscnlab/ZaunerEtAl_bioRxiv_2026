# Keep the profile menus available to the navbar while suppressing both the
# inherited public-site sidebar and the profile sidebar in the page layout.
# This leaves the left edge calm and gives every page TOC one stable position.
sidebar: false

execute:
  freeze: false
  warning: true
  message: true
  error: false

format:
  html:
    toc: true
    toc-title: "On this page"
    toc-location: right
    toc-depth: 3
    code-tools: true
    code-fold: true
    code-summary: "Show R code"
    page-layout: full
    include-after-body:
      - _includes/nathealth-mobile-toc.html
    css:
      - styles.css
      - styles-nathealth.css
